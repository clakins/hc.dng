<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henry - Photography &amp; Projects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Henry</strong>
    <nav id="filters"></nav>
  </header>
  <main class="grid" id="grid"></main>

  <script src="projects.js"></script>
  <script>
    const types = [...new Set(PROJECTS.flatMap(p => p.types))].sort();
    const grid = document.getElementById("grid");
    const nav = document.getElementById("filters");

    function show() {
      const type = location.hash.slice(1);
      nav.innerHTML = ["all", ...types].map(t =>
        `<a href="#${t === "all" ? "" : t}" class="${(type || "all") === t ? "on" : ""}">${t}</a>`).join("");
      grid.innerHTML = PROJECTS.filter(p => !type || p.types.includes(type)).map(p => `
        <a href="project.html?p=${p.slug}">
          ${(c => c ? `<img loading="lazy" src="photos/${p.slug}/thumb/${c.img}" alt="">` : `<img alt="">`)(p.photos.find(x => x.img))}
          <span>${p.title} <small>${p.date.slice(0, 4)}</small></span>
        </a>`).join("");
    }
    addEventListener("hashchange", show);
    show();
  </script>
</body>
</html>
